<!DOCTYPE html>

<html>

<head>
	<title>Size Chart</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<table>
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (in)</th>
                <th>Front Length (in)</th>
                <th>Shoulder (in)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>XS</td>
                <td>36</td>
                <td>25</td>
                <td>16</td>
            </tr>
            <tr>
                <td>S</td>
                <td>38</td>
                <td>26</td>
                <td>17</td>
            </tr>
            <tr>
                <td>M</td>
                <td>40</td>
                <td>27</td>
                <td>18</td>
            </tr>
            <tr>
                <td>L</td>
                <td>42</td>
                <td>28</td>
                <td>19</td>
            </tr>
            <tr>
                <td>XL</td>
                <td>44</td>
                <td>29</td>
                <td>20</td>
            </tr>
            <tr>
                <td>XXL</td>
                <td>46</td>
                <td>30</td>
                <td>21</td>
            </tr>
        </tbody>
    </table>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
